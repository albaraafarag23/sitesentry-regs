name: CI

on:
  push:
  pull_request:

jobs:
  # Fast tests that need no database, no model download and no API key.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest tests/test_chunking.py tests/test_agent.py

  # The real pipeline against PostgreSQL + pgvector: ingest the PDFs, run every test,
  # and measure retrieval quality on the evaluation set.
  integration:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: regs
          POSTGRES_PASSWORD: regs
          POSTGRES_DB: regs
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U regs -d regs"
          --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache the embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-multilingual-e5-small
      - name: Install dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Download and ingest the regulations
        run: |
          python -m app.download
          python -m app.ingest
      - name: All tests
        run: pytest
      - name: Retrieval evaluation
        run: python -m app.evaluate
