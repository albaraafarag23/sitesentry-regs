services:
  db:
    # Official pgvector image: normal PostgreSQL 17 with the "vector" extension installed.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: regs
      POSTGRES_PASSWORD: regs   # local development only
      POSTGRES_DB: regs
    ports:
      # Host port 5433 so it does not clash with another PostgreSQL on 5432 (e.g. SiteSentry).
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regs -d regs"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The API in a container. Not started by default; use: docker compose --profile full up
  api:
    profiles: ["full"]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://regs:regs@db:5432/regs   # inside Compose the host is "db"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
